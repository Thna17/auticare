services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
      - --innodb-buffer-pool-size=512M
      - --innodb-log-file-size=128M
      - --max-connections=200
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-auticare}
      MYSQL_USER: ${MYSQL_USER:-auticare}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - auticare_mysql_prod_data:/var/lib/mysql
    networks:
      - auticare-internal
    healthcheck:
      test:
        ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p$${MYSQL_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migration-runner:
    image: auticare-api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: 'no'
    command: ['pnpm', '--filter', '@auticare/api', 'db:deploy']
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:-auticare}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-auticare}?connection_limit=20&pool_timeout=30
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - auticare-internal

  api:
    image: auticare-api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER:-auticare}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-auticare}?connection_limit=20&pool_timeout=30
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost}
      API_ORIGIN: ${API_ORIGIN:-http://localhost:3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-7d}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
      STORAGE_UPLOAD_RETENTION_HOURS: ${STORAGE_UPLOAD_RETENTION_HOURS:-24}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - auticare_uploads_prod_data:/app/storage/uploads
    depends_on:
      mysql:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
    networks:
      - auticare-internal
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health/ready']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - auticare-internal
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1/nginx-health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  auticare-internal:
    driver: bridge

volumes:
  auticare_mysql_prod_data:
  auticare_uploads_prod_data:
