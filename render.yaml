# ==============================================================================
# AutiCare Render Blueprint Specification (100% Free Tier Deployment)
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Backend API Container (Render Free Web Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: auticare-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    plan: free
    region: singapore # Choose singapore, oregon, ohio, or frankfurt
    branch: main
    autoDeploy: true
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard: MySQL URI from TiDB Cloud / Aiven
      - key: JWT_ACCESS_SECRET
        generateValue: true # Render automatically generates cryptographically strong random value
      - key: JWT_REFRESH_SECRET
        generateValue: true # Render automatically generates cryptographically strong random value
      - key: APP_ORIGIN
        sync: false # Set in Render Dashboard: e.g. https://auticare.vercel.app or Render static site URL
      - key: API_ORIGIN
        sync: false # Set in Render Dashboard: e.g. https://auticare-api.onrender.com
      - key: STORAGE_DRIVER
        value: local
      - key: LOG_LEVEL
        value: info
      # Optional SMTP Email variables (e.g. Gmail App Password or Resend)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  # ----------------------------------------------------------------------------
  # Frontend Static SPA (Optional: Render Free Static Site)
  # (You can also deploy frontend to Vercel or Cloudflare Pages)
  # ----------------------------------------------------------------------------
  - type: web
    name: auticare-web
    runtime: static
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: pnpm build:web
    staticPublishPath: apps/web/dist/web/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
